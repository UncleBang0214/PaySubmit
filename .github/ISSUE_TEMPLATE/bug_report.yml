name: 缺陷报告
description: 报告可复现的缺陷（请勿粘贴任何真实密钥、商编或完整请求明文）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请确认：
        - 已在最新版本复现；
        - **绝不粘贴真实商编、密钥、Cookie、完整请求体或完整业务响应**；
        - 涉及安全漏洞请改用私密渠道（见 Issue 新建页联系入口）。
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 安装包版本或提交哈希（如 0.1.0 或 abc1234）
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - 其他（请在复现步骤说明）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请用合成假数据描述操作步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附脱敏后的错误提示或截图
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 如日志片段（务必脱敏）、网络环境等
    validations:
      required: false
