name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先确认该建议符合项目定位：**纯本地工具、不提供支付服务、不接触/上传用户密钥**。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前遇到的痛点或缺失的能力
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 描述你希望如何实现
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法
    validations:
      required: false
  - type: checkboxes
    id: boundary
    attributes:
      label: 合规确认
      options:
        - label: 该建议不涉及自建后端、遥测、密钥上传或关闭证书校验
          required: true
